[package]
name = "mcmc"
authors = ["Shadowbee"]
license = "AGPL-3.0-only"
repository = "https://codeberg.org/shadowbee/Minecraft-Mod-Cli"
description = "A clitool to manage minecraft mods for servers"
readme = "README.md"
version = "0.0.1"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
colorful = "0.3.2"
error-chain = "0.12.4"
futures-util = "0.3.34"
futures = "0.3.34"
indicatif = "0.18.6"
inquire = { version = "0.9.4", features = ["crossterm"] }
inquire-derive = "0.9.4"
quick-xml = { version = "0.42.0", features = ["serialize"] }
ratatui = { version = "0.30.2", default-features = false ,features = ["crossterm"] }
rayon = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["blocking", "stream", "json"] }
semver = { version = "1.0.28", features = ["serde"] }
serde =  { version = "1.0.229", features = ["derive"] }
strum = "0.28.0"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
walkdir = "2.5.0"
sha1 = "0.11.0"
hex = "0.4.3"
serde_json = "1.0.151"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.100.0"

# tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# tracing-panic = "0.1.2"
# tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
# tracing-unwrap = "1.0.1"
