[package]
name = "mcmc"
authors = ["Shadowbee"]
license = "AGPL-3.0-only"
repository = "https://codeberg.org/shadowbee/Minecraft-Mod-Cli"
description = "A clitool to manage minecraft mods for servers"
readme = "README.md"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }

serde =  { version = "1.0.229", features = ["derive"] }
toml = "1.1.4+spec-1.1.0"
anyhow = "1.0.104"
ratatui = { version = "0.30.2", default-features = false ,features = ["termion"] }
color-eyre = "0.6.5"
semver = { version = "1.0.28", features = ["serde"] }
tokio = { version = "1.53.1", features = ["full"] }
indicatif = "0.18.6"
futures-util = "0.3.33"
error-chain = "0.12.4"
ftp = "3.0.1"
futures = "0.3.33"
reqwest = { version = "0.13.4", features = ["blocking", "stream", "json"] }
